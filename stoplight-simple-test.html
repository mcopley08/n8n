<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Stoplight Test</title>
    <style>
        body {
            font-family: monospace;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 { color: #4ec9b0; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #1177bb; }
        pre {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
    </style>
</head>
<body>
    <h1>🔬 Simple Stoplight API Test</h1>
    <p>Test the exact node endpoint that should work</p>

    <input type="text" id="token" placeholder="Paste your bearer token here" />
    <button onclick="testKnownNode()">Test Known Working Node</button>
    <button onclick="testTableOfContents()">Test Table of Contents</button>
    <button onclick="testProjectInfo()">Test Project Info</button>

    <div id="result"></div>

    <script>
        const PROJECT_ID = 'cHJqOjI4NDA4Mw';
        const KNOWN_NODE = 'y7hndq02qrzak-authentication-authorization-and-scope';

        async function testEndpoint(url, description) {
            const token = document.getElementById('token').value.trim();
            const resultDiv = document.getElementById('result');

            if (!token) {
                alert('Please enter a token first!');
                return;
            }

            resultDiv.innerHTML = `<p>Testing: <strong>${description}</strong></p><p>URL: ${url}</p><p>Loading...</p>`;

            try {
                console.log('Fetching:', url);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'accept': '*/*',
                        'accept-language': 'en-US,en;q=0.9',
                        'authorization': `Bearer ${token}`,
                        'origin': 'https://developer.buildops.com',
                        'referer': 'https://developer.buildops.com/',
                        'stoplight-elements-version': '3.0.8',
                    },
                    mode: 'cors',
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);

                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ SUCCESS</p>
                        <p>Status: ${response.status}</p>
                        <p>Content-Type: ${contentType}</p>
                        <pre>${JSON.stringify(data, null, 2).substring(0, 2000)}...</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">❌ FAILED</p>
                        <p>Status: ${response.status} ${response.statusText}</p>
                        <p>Content-Type: ${contentType}</p>
                        <pre>${typeof data === 'object' ? JSON.stringify(data, null, 2) : data}</pre>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <p class="error">❌ ERROR</p>
                    <pre>${error.name}: ${error.message}\n\n${error.stack}</pre>
                `;
            }
        }

        function testKnownNode() {
            const url = `https://stoplight.io/api/v1/projects/${PROJECT_ID}/nodes/${KNOWN_NODE}`;
            testEndpoint(url, 'Known Working Node (should work!)');
        }

        function testTableOfContents() {
            const url = `https://stoplight.io/api/v1/projects/${PROJECT_ID}/table-of-contents`;
            testEndpoint(url, 'Table of Contents (might be 500)');
        }

        function testProjectInfo() {
            const url = `https://stoplight.io/api/v1/projects/${PROJECT_ID}`;
            testEndpoint(url, 'Project Info (might be 500)');
        }
    </script>
</body>
</html>
